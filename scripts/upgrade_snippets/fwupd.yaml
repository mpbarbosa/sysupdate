# Firmware Update Configuration
# 
# Version: 0.1.0-alpha
# Date: 2025-12-18
# Author: mpb
# Repository: https://github.com/mpbarbosa/sysupdate
# Status: Non-production (Alpha)
#
# Version History:
#   0.1.0-alpha (2025-12-18) - Initial version

# Application identifiers
application:
  name: "fwupd"
  command: "fwupdmgr"
  display_name: "fwupd (Firmware Updater)"

# Messages
messages:
  checking_updates: "Checking fwupd updates..."
  install_help: |
    Install fwupd via package manager:
    - Debian/Ubuntu: sudo apt install fwupd
    - Fedora: sudo dnf install fwupd
    Reference: https://fwupd.org/
  failed_version: "Failed to get current fwupd version"
  update_success: "fwupd updated successfully"
  checking_firmware: "Checking for firmware updates..."
  no_firmware_updates: "No firmware updates available"
  firmware_updates_available: "Firmware updates available"
  updating_firmware: "Updating firmware..."
  firmware_update_success: "Firmware updated successfully"
  firmware_update_failed: "Firmware update failed"
  refresh_metadata: "Refreshing firmware metadata..."

# Version extraction
#   The "latest" version is resolved through upgrade_utils.sh's shared
#   apt_resolve_latest_version, not read straight off the apt candidate.
#   `--check-only` and `--snippet <id>` deliberately never run
#   `apt-get update`, so the locally cached index they read can be days old
#   and name a long-superseded version as the latest. While the index is
#   fresh the candidate still wins - it accounts for pinning and apt
#   preferences, so it is the version an upgrade would really install. Once
#   it is stale the resolver reads the Packages index of the repository that
#   serves this package, over the same URI as the machine's own apt source
#   and at apt's winning pin priority — including the sibling pockets apt
#   knows at that priority in the same archive family, which is where an
#   archive package's `<suite>-updates` and `<suite>-security` builds live.
#   It only ever moves the answer forward, and it leaves a held package on
#   its candidate, so the snippet never reports an upgrade apt would refuse.
version:
  command: "fwupdmgr --version"
  regex: '.*org.freedesktop.fwupd[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*'
  source: "apt"
  package_name: "fwupd"

# Update commands
update:
  method: "apt"
  update_command: "sudo apt-get update && sudo apt-get install --only-upgrade -y fwupd"
  output_lines: 15

# Firmware check and update
firmware:
  refresh_command: "fwupdmgr refresh"
  check_command: "fwupdmgr get-updates"
  # --no-reboot-check: stage the capsule but never reboot on our own. Many
  # updates need a reboot to land; the script says so and leaves the timing
  # to the user rather than dropping the machine mid-session.
  update_command: "fwupdmgr update --no-reboot-check"
  requires_sudo: false
  # Free space (MB) required on /boot/efi before staging a capsule update.
  # Capped at half the ESP when the partition is smaller than this, so a stock
  # 96-100MB ESP can still pass. fwupd does its own exact per-payload check.
  required_esp_mb: 32

# Remediation line for the blocking `insufficient_efi_space` readiness status.
# Shown on the dashboard card; mirrors the manual-cleanup advice printed by
# check_efi_space when automatic cleanup cannot free enough room.
remediation:
  insufficient_efi_space: "/boot/efi is too full to stage a firmware capsule — free space there (sudo apt autoremove --purge to drop old kernels, or remove stale vendor directories under /boot/efi/EFI), then re-run the firmware check."
